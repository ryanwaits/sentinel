# Sentinel audit worker — reference container deploy (Phase 6).
#
# Prereqs on the host:
#   1. bun run sandbox:build          # build audit-sentinel-simnet:local (the airgapped PoC image)
#   2. .env.local present with ANTHROPIC_API_KEY, STACKS_NODE_URL, SECONDLAYER_* (and SENTINEL_* opts)
#   3. mkdir -p /tmp/sentinel-sandbox  # the DooD scratch dir (see below)
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then expose :3001 publicly (LB / reverse proxy / tunnel) so secondlayer can deliver webhooks.
services:
  sentinel-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Host port is configurable (SENTINEL_BRIDGE_PORT) to dodge a local dev-server conflict on 3001;
      # the container always listens on 3001. In prod the reverse proxy / LB maps 443 → 3001.
      - "${SENTINEL_BRIDGE_PORT:-3001}:3001"
    env_file:
      - ../.env.local
    environment:
      - SENTINEL_SINK_DIR=/data/.sentinel
      # The Agent SDK's bypassPermissions → `claude --dangerously-skip-permissions`, which REFUSES to
      # run as root. The worker runs as root (so the mounted docker socket / DooD just works), so opt
      # into the sandbox escape-hatch. Safe here: trusted single-purpose worker; PoCs stay airgapped
      # (--network none). Revisit (non-root user + socket gid) for hardened multi-tenant.
      - IS_SANDBOX=1
      # Webhook HMAC secret (Standard Webhooks fallback for a single-sub setup). Passed from the host
      # env, NOT committed. MANDATORY in prod — without it the bridge fail-opens (skips verification).
      - SECONDLAYER_WEBHOOK_SECRET=${SECONDLAYER_WEBHOOK_SECRET:-}
      # DooD: inline-PoC source is written here and bind-mounted into the sandbox container. Because
      # bind mounts resolve on the HOST daemon, this path MUST be identical on host and in the worker
      # (see the volumes mount below) — otherwise the host can't find the file.
      - SENTINEL_SANDBOX_HOSTDIR=/tmp/sentinel-sandbox
    volumes:
      # Docker-out-of-Docker: run the airgapped `docker run --network none` PoC sandbox on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Durable monitoring state (sub secrets, spend ceiling, trigger ledger, notifications). External
      # KV is the prod upgrade (docs/product/backend-architecture.md); a volume is the MVP.
      - sentinel-data:/data
      # Same-path bind mount so inline-PoC files the worker writes are visible to the host daemon.
      - /tmp/sentinel-sandbox:/tmp/sentinel-sandbox
    restart: unless-stopped

  # The poll lane's cadence — runs the invariant registry → adjudicate → notify on an interval.
  # Same image, no ingress and no docker.sock (invariants don't run PoCs), shares the durable sink
  # with the bridge (warn-once state + snapshots). Swap for a platform cron hitting a /tick later.
  sentinel-scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bun", "run", "monitoring/scheduler.ts"]
    env_file:
      - ../.env.local
    environment:
      - SENTINEL_SINK_DIR=/data/.sentinel
      # Evaluation cadence (ms). Default 10m; tune per reward-cycle / reserve-watch needs.
      - SENTINEL_SCHEDULE_INTERVAL_MS=${SENTINEL_SCHEDULE_INTERVAL_MS:-600000}
    volumes:
      - sentinel-data:/data
    restart: unless-stopped

volumes:
  sentinel-data:
