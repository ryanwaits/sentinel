<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel · Contracts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg: oklch(0.99 0.003 60); --surface: oklch(0.976 0.004 60); --surface-2: oklch(0.985 0.004 60); --panel: oklch(0.966 0.004 60);
    --border: oklch(0.912 0.005 60); --border-strong: oklch(0.86 0.006 60);
    --ink: oklch(0.28 0.006 55); --ink-strong: oklch(0.18 0.006 55); --muted: oklch(0.60 0.006 55); --faint: oklch(0.72 0.005 55);
    --accent: oklch(0.64 0.224 33); --accent-ink: oklch(0.99 0.01 60); --accent-weak: oklch(0.64 0.224 33 / 0.10);
    --critical: oklch(0.55 0.225 27); --medium: oklch(0.70 0.15 66); --success: oklch(0.58 0.135 150); --success-weak: oklch(0.58 0.135 150 / 0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: oklch(0.165 0.004 60); --surface: oklch(0.202 0.005 60); --surface-2: oklch(0.235 0.006 60); --panel: oklch(0.185 0.004 60);
      --border: oklch(0.285 0.006 60); --border-strong: oklch(0.36 0.007 60);
      --ink: oklch(0.925 0.004 60); --ink-strong: oklch(0.985 0.003 60); --muted: oklch(0.66 0.007 60); --faint: oklch(0.52 0.006 60);
      --accent: oklch(0.685 0.2 36); --accent-ink: oklch(0.16 0.01 40); --accent-weak: oklch(0.685 0.2 36 / 0.17);
      --critical: oklch(0.64 0.2 28); --medium: oklch(0.76 0.13 72); --success: oklch(0.70 0.13 152); --success-weak: oklch(0.70 0.13 152 / 0.16);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Geist", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:"Geist Mono", ui-monospace, Menlo, monospace; font-feature-settings:"tnum" 1; }
  h1,h2,h3{ color:var(--ink-strong); letter-spacing:-0.012em; margin:0; font-weight:600; }
  button{ font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .tnum{ font-variant-numeric:tabular-nums; }
  ::-webkit-scrollbar{ width:11px; height:11px; } ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:99px; border:3px solid var(--bg); }
  [data-btn],[data-row]{ transition:background .15s ease, border-color .15s ease, color .15s ease; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .pulse{ animation:pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script>window.addEventListener("error",(e)=>{window.__err=(e.error&&e.error.stack)||e.message;});</script>
<script type="text/babel" data-presets="react">
const { useState } = React;
const I = {
  logo:(p)=><svg viewBox="0 0 24 24" width="20" height="20" fill="none" {...p}><path d="M12 2l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V5l7-3z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  alerts:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M12 3a5 5 0 00-5 5c0 4-1.5 5.5-2 6h14c-.5-.5-2-2-2-6a5 5 0 00-5-5z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" strokeWidth="1.5"/></svg>,
  contracts:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  plan:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" strokeWidth="1.5"/></svg>,
  audits:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M6 3h9l4 4v14H6z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M14 3v4h4" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M9 14l2 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  search:(p)=><svg viewBox="0 0 24 24" width="15" height="15" fill="none" {...p}><circle cx="11" cy="11" r="6" stroke="currentColor" strokeWidth="1.6"/><path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  chevron:(p)=><svg viewBox="0 0 24 24" width="15" height="15" fill="none" {...p}><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  plus:(p)=><svg viewBox="0 0 24 24" width="15" height="15" fill="none" {...p}><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>,
  check:(p)=><svg viewBox="0 0 24 24" width="12" height="12" fill="none" {...p}><path d="M5 12l4 4L19 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
};
function Chip({children, tone="neutral"}){
  const m = { neutral:["var(--surface-2)","var(--border)","var(--muted)"], accent:["var(--accent-weak)","transparent","var(--accent)"],
    success:["var(--success-weak)","transparent","var(--success)"], ghost:["transparent","var(--border)","var(--muted)"],
    crit:["color-mix(in oklch,var(--critical) 12%,transparent)","transparent","var(--critical)"], warn:["color-mix(in oklch,var(--medium) 16%,transparent)","transparent","var(--medium)"] }[tone];
  return <span className="mono" style={{fontSize:11, fontWeight:500, padding:"2px 7px", borderRadius:6, background:m[0], border:`1px solid ${m[1]}`, color:m[2], display:"inline-flex", alignItems:"center", gap:5, whiteSpace:"nowrap"}}>{children}</span>;
}
function Btn({children, kind="ghost", onClick}){
  const base={padding:"7px 13px", borderRadius:8, fontSize:13, fontWeight:500, border:"1px solid transparent", display:"inline-flex", alignItems:"center", gap:6};
  const k={ primary:{background:"var(--accent)", color:"var(--accent-ink)"}, ghost:{background:"transparent", color:"var(--ink)", borderColor:"var(--border-strong)"} }[kind];
  return <button data-btn onClick={onClick} style={{...base,...k}} onMouseEnter={e=>{if(kind==="ghost")e.currentTarget.style.background="var(--surface)";}} onMouseLeave={e=>{if(kind==="ghost")e.currentTarget.style.background="transparent";}}>{children}</button>;
}

const STATUS = { live:{c:"var(--success)", t:"live"}, auditing:{c:"var(--accent)", t:"auditing"}, paused:{c:"var(--faint)", t:"paused"} };
const CONTRACTS = [
  { name:"ccd002-treasury-mia-mining-v3", principal:"SP8A9…ccd002-treasury", arch:"dao", status:"live",
    fns:4, sigs:1, subs:"6 / 6", alerts:{critical:1}, audit:"3d ago · $1.88", spend:"$0.90" },
  { name:"v0-vault-sbtc", principal:"SP1A27…v0-vault-sbtc", arch:"vault", status:"live",
    fns:4, sigs:1, subs:"9 / 9", alerts:{high:1}, audit:"4d ago · $2.21", spend:"$1.42" },
  { name:"dlmm-pool-stx-usdcx", principal:"SM1FKX…dlmm-pool", arch:"amm", status:"live",
    fns:3, sigs:0, subs:"5 / 5", alerts:{high:1, info:1}, audit:"6d ago · $1.64", spend:"$1.74" },
  { name:"pool-registry-v3", principal:"SP9K…pool-registry-v3", arch:"proxy", status:"auditing",
    fns:null, sigs:null, subs:"provisioning", alerts:{}, audit:"in progress", spend:"—" },
];

function AlertCell({a}){
  const keys = Object.keys(a);
  if(!keys.length) return <span style={{color:"var(--faint)"}}>—</span>;
  return <span style={{display:"inline-flex", gap:6}}>
    {a.critical && <Chip tone="crit">{a.critical} critical</Chip>}
    {a.high && <Chip tone="accent">{a.high} high</Chip>}
    {a.info && <Chip tone="ghost">{a.info} info</Chip>}
  </span>;
}

function Row({c, i}){
  const st = STATUS[c.status]; const auditing = c.status==="auditing";
  return (
    <div data-row style={{display:"grid", gridTemplateColumns:"2fr 0.9fr 1fr 1.1fr 1.1fr 0.7fr 20px", gap:14, alignItems:"center",
      padding:"15px 20px", borderTop:i?"1px solid var(--border)":"none", cursor:"pointer", background:"var(--bg)"}}
      onMouseEnter={e=>e.currentTarget.style.background="var(--surface)"} onMouseLeave={e=>e.currentTarget.style.background="var(--bg)"}>
      <div style={{minWidth:0}}>
        <div style={{display:"flex", alignItems:"center", gap:9}}>
          <span className={auditing?"pulse":""} style={{width:8, height:8, borderRadius:99, background:st.c, flexShrink:0}}/>
          <span className="mono" style={{color:"var(--ink-strong)", fontSize:13.5, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{c.name}</span>
          <Chip tone="neutral">{c.arch}</Chip>
        </div>
        <div className="mono" style={{fontSize:11.5, color:"var(--faint)", marginTop:5, paddingLeft:17}}>{c.principal}</div>
      </div>
      <div style={{fontSize:13, color:"var(--muted)"}}>{auditing ? <span style={{color:"var(--accent)"}}>discovering…</span> : <span><b style={{color:"var(--ink)", fontWeight:500}} className="tnum">{c.fns}</b> fns · <b style={{color:"var(--ink)", fontWeight:500}} className="tnum">{c.sigs}</b> sig{c.sigs===1?"":"s"}</span>}</div>
      <div style={{fontSize:13}}>{auditing ? <span style={{color:"var(--accent)"}}>provisioning</span> : <span style={{display:"inline-flex", alignItems:"center", gap:6, color:"var(--success)"}}><I.check/><span className="mono tnum" style={{color:"var(--muted)"}}>{c.subs} live</span></span>}</div>
      <div><AlertCell a={c.alerts}/></div>
      <div className="mono" style={{fontSize:12.5, color: auditing?"var(--accent)":"var(--muted)"}}>{c.audit}</div>
      <div className="mono tnum" style={{fontSize:13, color:"var(--ink)"}}>{c.spend}</div>
      <span style={{color:"var(--faint)", display:"inline-flex"}}><I.chevron/></span>
    </div>
  );
}

function Nav(){
  const items=[["Alerts",I.alerts,false,4],["Contracts",I.contracts,true],["Monitoring Plan",I.plan,false],["Audits",I.audits,false]];
  return <aside style={{width:236, flexShrink:0, background:"var(--panel)", borderRight:"1px solid var(--border)", display:"flex", flexDirection:"column", padding:"16px 12px"}}>
    <div style={{display:"flex", alignItems:"center", gap:9, padding:"4px 8px 20px"}}><span style={{color:"var(--accent)"}}><I.logo/></span><span style={{fontWeight:600, fontSize:16, color:"var(--ink-strong)"}}>Sentinel</span></div>
    <nav style={{display:"grid", gap:2}}>{items.map(([l,ic,act,b])=>(
      <a key={l} data-btn href="#" onClick={e=>e.preventDefault()} style={{display:"flex", alignItems:"center", gap:10, padding:"8px 10px", borderRadius:8, fontSize:13.5, textDecoration:"none", fontWeight:act?500:450, color:act?"var(--ink-strong)":"var(--muted)", background:act?"var(--surface)":"transparent"}}
        onMouseEnter={e=>{if(!act)e.currentTarget.style.background="var(--surface)";}} onMouseLeave={e=>{if(!act)e.currentTarget.style.background="transparent";}}>
        <span style={{color:act?"var(--accent)":"var(--faint)", display:"inline-flex"}}>{ic()}</span>{l}<span style={{flex:1}}/>{b&&<span className="mono tnum" style={{fontSize:11, color:"var(--faint)"}}>{b}</span>}</a>))}
    </nav>
    <div style={{flex:1}}/>
    <div style={{fontSize:11.5, color:"var(--faint)", padding:"8px 10px", borderTop:"1px solid var(--border)"}}>Audit-informed monitoring<br/>Prevention + Detection</div>
  </aside>;
}
function TopBar(){
  return <header style={{height:56, flexShrink:0, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", gap:16, padding:"0 24px"}}>
    <button data-btn style={{display:"flex", alignItems:"center", gap:9, width:320, maxWidth:"36vw", padding:"7px 11px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--muted)", fontSize:13}}>
      <I.search/><span style={{flex:1, textAlign:"left"}}>Search</span><span className="mono" style={{fontSize:11, border:"1px solid var(--border)", borderRadius:5, padding:"1px 5px", color:"var(--faint)"}}>⌘K</span></button>
    <span style={{flex:1}}/>
    <span style={{fontSize:12.5, color:"var(--muted)", display:"inline-flex", alignItems:"center", gap:7}}><span style={{width:7,height:7,borderRadius:99,background:"var(--success)"}}/>Watching <b style={{color:"var(--ink)",fontWeight:500}} className="tnum">3</b> contracts · <b style={{color:"var(--ink)",fontWeight:500}} className="tnum">9</b> functions</span>
  </header>;
}

function Stat({n, label, tone}){
  return <div style={{padding:"14px 18px", borderRight:"1px solid var(--border)", flex:1}}>
    <div className="tnum" style={{fontSize:22, fontWeight:600, color: tone||"var(--ink-strong)", letterSpacing:"-0.02em"}}>{n}</div>
    <div style={{fontSize:12, color:"var(--muted)", marginTop:2}}>{label}</div></div>;
}

function App(){
  return (
    <div style={{display:"flex", height:"100vh", overflow:"hidden"}}>
      <Nav/>
      <div style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <TopBar/>
        <main style={{flex:1, overflow:"auto"}}>
          <div style={{maxWidth:960, margin:"0 auto", padding:"28px 0 60px"}}>
            <div style={{padding:"0 24px", display:"flex", alignItems:"flex-end", gap:12, marginBottom:22}}>
              <div>
                <h1 style={{fontSize:24}}>Contracts</h1>
                <p style={{margin:"5px 0 0", color:"var(--muted)", fontSize:13.5}}>The value-holding contracts Sentinel audits and watches.</p>
              </div>
              <span style={{flex:1}}/>
              <Btn kind="primary"><I.plus/> Add contract</Btn>
            </div>

            {/* summary strip (restrained, not a hero-metric block) */}
            <div style={{margin:"0 24px 24px", border:"1px solid var(--border)", borderRadius:11, display:"flex", background:"var(--surface-2)", overflow:"hidden"}}>
              <Stat n="3" label="watching · 1 auditing"/>
              <Stat n="9" label="functions covered"/>
              <Stat n="2" label="open alerts" tone="var(--accent)"/>
              <Stat n="$4.06" label="today · $50 ceiling"/>
              <div style={{padding:"14px 18px", flex:1}}><div className="tnum" style={{fontSize:22, fontWeight:600, color:"var(--success)", letterSpacing:"-0.02em"}}>20 / 20</div><div style={{fontSize:12, color:"var(--muted)", marginTop:2}}>subscriptions live</div></div>
            </div>

            {/* table */}
            <div style={{margin:"0 24px", border:"1px solid var(--border)", borderRadius:11, overflow:"hidden"}}>
              <div style={{display:"grid", gridTemplateColumns:"2fr 0.9fr 1fr 1.1fr 1.1fr 0.7fr 20px", gap:14, padding:"10px 20px", fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", color:"var(--faint)", borderBottom:"1px solid var(--border)", background:"var(--surface-2)"}}>
                <span>Contract</span><span>Watching</span><span>Subscriptions</span><span>Open alerts</span><span>Last audit</span><span>Spend</span><span/></div>
              {CONTRACTS.map((c,i)=> <Row key={c.name} c={c} i={i}/>)}
            </div>
            <p style={{margin:"14px 24px 0", fontSize:12.5, color:"var(--faint)"}}>Discovery ranks candidates by TVL × risk. Add a contract to audit and start watching it.</p>
          </div>
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
