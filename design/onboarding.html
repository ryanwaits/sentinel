<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel · Onboard a contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg: oklch(0.99 0.003 60); --surface: oklch(0.976 0.004 60); --surface-2: oklch(0.985 0.004 60);
    --border: oklch(0.912 0.005 60); --border-strong: oklch(0.86 0.006 60);
    --ink: oklch(0.28 0.006 55); --ink-strong: oklch(0.18 0.006 55); --muted: oklch(0.60 0.006 55); --faint: oklch(0.72 0.005 55);
    --accent: oklch(0.64 0.224 33); --accent-ink: oklch(0.99 0.01 60); --accent-weak: oklch(0.64 0.224 33 / 0.10);
    --medium: oklch(0.70 0.15 66); --success: oklch(0.58 0.135 150); --success-weak: oklch(0.58 0.135 150 / 0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: oklch(0.165 0.004 60); --surface: oklch(0.202 0.005 60); --surface-2: oklch(0.235 0.006 60);
      --border: oklch(0.285 0.006 60); --border-strong: oklch(0.36 0.007 60);
      --ink: oklch(0.925 0.004 60); --ink-strong: oklch(0.985 0.003 60); --muted: oklch(0.66 0.007 60); --faint: oklch(0.52 0.006 60);
      --accent: oklch(0.685 0.2 36); --accent-ink: oklch(0.16 0.01 40); --accent-weak: oklch(0.685 0.2 36 / 0.17);
      --medium: oklch(0.76 0.13 72); --success: oklch(0.70 0.13 152); --success-weak: oklch(0.70 0.13 152 / 0.16);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:"Geist", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:"Geist Mono", ui-monospace, Menlo, monospace; font-feature-settings:"tnum" 1; }
  h1,h2,h3{ color:var(--ink-strong); letter-spacing:-0.015em; margin:0; font-weight:600; }
  button{ font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .tnum{ font-variant-numeric:tabular-nums; }
  [data-btn],[data-opt]{ transition:background .15s ease, border-color .15s ease, color .15s ease; }
  .fade{ animation:f .25s cubic-bezier(0.22,1,0.36,1); } @keyframes f{ from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
  @keyframes spin{ to{ transform:rotate(360deg); } } .spin{ animation:spin .8s linear infinite; }
  input{ font:inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script>window.addEventListener("error",(e)=>{window.__err=(e.error&&e.error.stack)||e.message;});</script>
<script type="text/babel" data-presets="react">
const { useState } = React;
const Logo=(p)=><svg viewBox="0 0 24 24" width="22" height="22" fill="none" {...p}><path d="M12 2l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V5l7-3z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Check=(p)=><svg viewBox="0 0 24 24" width="13" height="13" fill="none" {...p}><path d="M5 12l4 4L19 7" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Spinner=()=><svg className="spin" viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--border-strong)" strokeWidth="2.5"/><path d="M21 12a9 9 0 00-9-9" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round"/></svg>;

function Chip({children, tone="neutral"}){
  const m={ neutral:["var(--surface-2)","var(--border)","var(--muted)"], accent:["var(--accent-weak)","transparent","var(--accent)"],
    success:["var(--success-weak)","transparent","var(--success)"], ghost:["transparent","var(--border)","var(--muted)"] }[tone];
  return <span className="mono" style={{fontSize:11, fontWeight:500, padding:"2px 7px", borderRadius:6, background:m[0], border:`1px solid ${m[1]}`, color:m[2], display:"inline-flex", alignItems:"center", gap:5, whiteSpace:"nowrap"}}>{children}</span>;
}
function Btn({children, kind="primary", onClick, wide}){
  const base={padding:"10px 18px", borderRadius:9, fontSize:14, fontWeight:500, border:"1px solid transparent", display:"inline-flex", alignItems:"center", justifyContent:"center", gap:7, width:wide?"100%":"auto"};
  const k={ primary:{background:"var(--accent)", color:"var(--accent-ink)"}, ghost:{background:"transparent", color:"var(--ink)", borderColor:"var(--border-strong)"}, quiet:{background:"transparent", color:"var(--muted)"} }[kind];
  return <button data-btn onClick={onClick} style={{...base,...k}} onMouseEnter={e=>{if(kind==="ghost")e.currentTarget.style.background="var(--surface)";}} onMouseLeave={e=>{if(kind==="ghost")e.currentTarget.style.background="transparent";}}>{children}</button>;
}

const DISCOVERED = [
  {name:"v0-vault-sbtc", arch:"vault", tvl:"≈ 51 BTC", risk:"high"},
  {name:"ccd002-treasury-mia", arch:"dao", tvl:"≈ 4.1M STX", risk:"high"},
  {name:"dlmm-pool-stx-usdcx", arch:"amm", tvl:"≈ 1.8M STX", risk:"medium"},
];
const PHASES = [
  {k:"Discover value and entrypoints", done:true},
  {k:"Audit with 5 specialist subagents", done:true},
  {k:"Adversarially verify each finding", running:true},
  {k:"Reproduce in the airgapped sandbox", pending:true},
  {k:"Distill the monitoring scope", pending:true},
];
const STEPS = ["Add", "Audit", "Plan", "Live"];

function Stepper({step}){
  return <div style={{display:"flex", alignItems:"center", gap:0, marginBottom:34}}>
    {STEPS.map((s,i)=>{
      const done=i<step, cur=i===step;
      return <React.Fragment key={s}>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <span style={{width:24, height:24, borderRadius:99, display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:500,
            background: done?"var(--accent)":cur?"var(--accent-weak)":"var(--surface-2)", color: done?"var(--accent-ink)":cur?"var(--accent)":"var(--faint)",
            border: cur?"1px solid var(--accent)":"1px solid var(--border)"}}>{done?<Check/>:i+1}</span>
          <span style={{fontSize:13, fontWeight: cur?500:450, color: cur||done?"var(--ink)":"var(--faint)"}}>{s}</span>
        </div>
        {i<STEPS.length-1 && <div style={{flex:1, height:1, background:"var(--border)", margin:"0 12px"}}/>}
      </React.Fragment>;
    })}
  </div>;
}

/* ---------- steps ---------- */
function StepAdd({onNext}){
  const [sel, setSel] = useState("v0-vault-sbtc");
  const [tier, setTier] = useState("deep");
  return <div className="fade">
    <h1 style={{fontSize:24}}>What should Sentinel watch?</h1>
    <p style={{color:"var(--muted)", marginTop:8, fontSize:14.5}}>Paste a Clarity contract, or pick one we ranked by value and risk. Sentinel audits it, then scopes monitoring from what it finds.</p>
    <div style={{marginTop:24, display:"flex", gap:8}}>
      <div style={{flex:1, display:"flex", alignItems:"center", gap:8, border:"1px solid var(--border)", borderRadius:9, padding:"10px 13px", background:"var(--surface)"}}>
        <span className="mono" style={{color:"var(--faint)", fontSize:13}}>SP…</span>
        <input placeholder="paste a contract principal.name" style={{flex:1, border:"none", outline:"none", background:"transparent", color:"var(--ink)", fontSize:13.5}} className="mono"/>
      </div>
    </div>
    <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.06em", color:"var(--faint)", margin:"26px 0 10px"}}>Discovered for you</div>
    <div style={{display:"grid", gap:8}}>
      {DISCOVERED.map(d=>{
        const on=sel===d.name;
        return <button key={d.name} data-opt onClick={()=>setSel(d.name)} style={{textAlign:"left", display:"flex", alignItems:"center", gap:12, padding:"13px 15px", borderRadius:10,
          border:`1px solid ${on?"var(--accent)":"var(--border)"}`, background:on?"var(--accent-weak)":"var(--surface)"}}>
          <span style={{width:16, height:16, borderRadius:99, border:`1px solid ${on?"var(--accent)":"var(--border-strong)"}`, background:on?"var(--accent)":"transparent", display:"inline-flex", alignItems:"center", justifyContent:"center", color:"var(--accent-ink)"}}>{on&&<Check/>}</span>
          <span className="mono" style={{fontSize:13.5, color:"var(--ink-strong)", fontWeight:500}}>{d.name}</span>
          <Chip tone="neutral">{d.arch}</Chip>
          <span style={{flex:1}}/>
          <span className="mono" style={{fontSize:12, color:"var(--muted)"}}>{d.tvl}</span>
          <Chip tone={d.risk==="high"?"accent":"ghost"}>{d.risk} risk</Chip>
        </button>;
      })}
    </div>
    <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.06em", color:"var(--faint)", margin:"26px 0 10px"}}>Depth</div>
    <div style={{display:"flex", gap:8}}>
      {[["deep","Deep","Opus · full panel · ~$2 · minutes"],["monitor","Monitor","Sonnet · fast · ~$0.40"]].map(([k,t,d])=>{
        const on=tier===k;
        return <button key={k} data-opt onClick={()=>setTier(k)} style={{flex:1, textAlign:"left", padding:"13px 15px", borderRadius:10, border:`1px solid ${on?"var(--accent)":"var(--border)"}`, background:on?"var(--accent-weak)":"var(--surface)"}}>
          <div style={{fontWeight:500, color:"var(--ink-strong)", fontSize:14}}>{t}</div>
          <div style={{fontSize:12, color:"var(--muted)", marginTop:3}}>{d}</div>
        </button>;
      })}
    </div>
    <div style={{marginTop:30, display:"flex", justifyContent:"flex-end"}}><Btn onClick={onNext}>Audit and watch {sel} →</Btn></div>
  </div>;
}

function StepAudit({onNext}){
  return <div className="fade">
    <div style={{display:"flex", alignItems:"center", gap:10}}><h1 style={{fontSize:22}}>Auditing v0-vault-sbtc</h1><Chip tone="accent">deep</Chip></div>
    <p style={{color:"var(--muted)", marginTop:8, fontSize:14}}>The multi-agent engine is reading the contract, arguing with itself, and reproducing anything it finds. This usually takes a few minutes.</p>
    <div style={{marginTop:24, border:"1px solid var(--border)", borderRadius:11, overflow:"hidden", background:"var(--surface-2)"}}>
      {PHASES.map((p,i)=>(
        <div key={i} style={{display:"flex", alignItems:"center", gap:12, padding:"13px 16px", borderTop:i?"1px solid var(--border)":"none", background:"var(--bg)"}}>
          <span style={{width:20, display:"inline-flex", justifyContent:"center"}}>{p.done?<span style={{color:"var(--success)"}}><Check/></span>:p.running?<Spinner/>:<span style={{width:8, height:8, borderRadius:99, background:"var(--border-strong)"}}/>}</span>
          <span style={{fontSize:13.5, color: p.pending?"var(--faint)":"var(--ink)"}}>{p.k}</span>
          <span style={{flex:1}}/>
          {p.running && <span style={{fontSize:12, color:"var(--accent)"}}>running…</span>}
        </div>))}
    </div>
    <div style={{marginTop:16, padding:"13px 15px", border:"1px solid var(--border)", borderRadius:10, background:"var(--surface)", display:"flex", gap:10, alignItems:"center"}}>
      <span style={{color:"var(--accent)"}}><Spinner/></span>
      <span style={{fontSize:13}}>Found <b style={{color:"var(--ink-strong)", fontWeight:500}}>socialize-debt unbounded LP loss</b> <span style={{color:"var(--muted)"}}>· verifying, then reproducing in the sandbox</span></span>
    </div>
    <div style={{marginTop:14, fontSize:12.5, color:"var(--faint)", display:"flex", gap:16}}><span className="mono tnum">2m 41s elapsed</span><span className="mono tnum">$0.74 so far</span><span>5 subagents</span></div>
    <div style={{marginTop:26, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
      <span style={{fontSize:12.5, color:"var(--faint)"}}>You can close this. We'll email you when it's done.</span>
      <Btn onClick={onNext}>Review the plan →</Btn>
    </div>
  </div>;
}

function StepPlan({onNext, onBack}){
  return <div className="fade">
    <h1 style={{fontSize:23}}>Sentinel found 1 bug and drafted your scope</h1>
    <p style={{color:"var(--muted)", marginTop:8, fontSize:14}}>This is what monitoring will watch, derived from the audit. Go live now with sensible defaults, and fine-tune anything later in the Monitoring Plan.</p>
    <div style={{marginTop:22, display:"grid", gap:12}}>
      <div style={{border:"1px solid var(--border)", borderRadius:11, padding:"15px 17px", background:"var(--surface-2)"}}>
        <div style={{display:"flex", alignItems:"center", gap:9}}><span style={{fontSize:13.5, fontWeight:500, color:"var(--ink-strong)"}}>4 watched functions</span><span style={{flex:1}}/><Chip tone="success"><Check/> ready</Chip></div>
        <div style={{display:"flex", gap:7, marginTop:11, flexWrap:"wrap"}}>
          <Chip tone="neutral">socialize-debt</Chip><Chip tone="neutral">system-borrow</Chip><Chip tone="neutral">redeem</Chip><Chip tone="neutral">register-market</Chip></div>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
        <div style={{border:"1px solid var(--border)", borderRadius:11, padding:"15px 17px", background:"var(--surface-2)"}}>
          <div style={{fontSize:13.5, fontWeight:500, color:"var(--ink-strong)"}}>1 detection signature</div>
          <p style={{margin:"7px 0 0", fontSize:12.5, color:"var(--muted)"}}>socialize-debt LP loss, with a green PoC. Watches for the bug being exploited.</p>
        </div>
        <div style={{border:"1px solid var(--border)", borderRadius:11, padding:"15px 17px", background:"var(--surface-2)"}}>
          <div style={{fontSize:13.5, fontWeight:500, color:"var(--ink-strong)"}}>1 outflow baseline</div>
          <p style={{margin:"7px 0 0", fontSize:12.5, color:"var(--muted)"}}>sBTC p99 = 770,115 sats, from 300 real outflows. Suggested as your gate.</p>
        </div>
      </div>
    </div>
    <div style={{marginTop:28, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
      <Btn kind="quiet" onClick={onBack}>← Back</Btn>
      <Btn onClick={onNext}>Provision and go live →</Btn>
    </div>
  </div>;
}

function StepLive(){
  return <div className="fade" style={{textAlign:"center", paddingTop:14}}>
    <div style={{width:56, height:56, borderRadius:99, background:"var(--success-weak)", color:"var(--success)", display:"inline-flex", alignItems:"center", justifyContent:"center", margin:"0 auto 20px"}}>
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
    <h1 style={{fontSize:24}}>Monitoring is live</h1>
    <p style={{color:"var(--muted)", marginTop:10, fontSize:14.5, maxWidth:"52ch", marginInline:"auto"}}>
      Sentinel is watching <b style={{color:"var(--ink)", fontWeight:500}}>v0-vault-sbtc</b> across <b style={{color:"var(--ink)", fontWeight:500}}>9 subscriptions</b>. You'll be paged when a proposal enters the timelock, or an outflow breaks the baseline. Nothing acts without you.</p>
    <div style={{display:"flex", gap:10, justifyContent:"center", marginTop:28}}><Btn>Go to dashboard</Btn><Btn kind="ghost">Watch another contract</Btn></div>
  </div>;
}

function App(){
  const [step, setStep] = useState(0);
  return (
    <div style={{minHeight:"100vh", display:"flex", flexDirection:"column"}}>
      <header style={{padding:"20px 28px", display:"flex", alignItems:"center", gap:9, borderBottom:"1px solid var(--border)"}}>
        <span style={{color:"var(--accent)"}}><Logo/></span><span style={{fontWeight:600, fontSize:16, color:"var(--ink-strong)"}}>Sentinel</span>
        <span style={{flex:1}}/><span style={{fontSize:12.5, color:"var(--muted)"}}>Set up monitoring</span>
      </header>
      <main style={{flex:1, display:"flex", justifyContent:"center", padding:"48px 24px"}}>
        <div style={{width:"100%", maxWidth:660}}>
          <Stepper step={step}/>
          {step===0 && <StepAdd onNext={()=>setStep(1)}/>}
          {step===1 && <StepAudit onNext={()=>setStep(2)}/>}
          {step===2 && <StepPlan onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
          {step===3 && <StepLive/>}
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
