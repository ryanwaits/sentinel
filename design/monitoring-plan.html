<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel · Monitoring Plan · v0-vault-sbtc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg: oklch(0.99 0.003 60); --surface: oklch(0.976 0.004 60); --surface-2: oklch(0.985 0.004 60); --panel: oklch(0.966 0.004 60);
    --border: oklch(0.912 0.005 60); --border-strong: oklch(0.86 0.006 60);
    --ink: oklch(0.28 0.006 55); --ink-strong: oklch(0.18 0.006 55); --muted: oklch(0.60 0.006 55); --faint: oklch(0.70 0.005 55);
    --accent: oklch(0.64 0.224 33); --accent-ink: oklch(0.99 0.01 60); --accent-weak: oklch(0.64 0.224 33 / 0.10);
    --critical: oklch(0.55 0.225 27); --medium: oklch(0.70 0.15 66); --success: oklch(0.58 0.135 150); --success-weak: oklch(0.58 0.135 150 / 0.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: oklch(0.165 0.004 60); --surface: oklch(0.202 0.005 60); --surface-2: oklch(0.235 0.006 60); --panel: oklch(0.185 0.004 60);
      --border: oklch(0.285 0.006 60); --border-strong: oklch(0.36 0.007 60);
      --ink: oklch(0.925 0.004 60); --ink-strong: oklch(0.985 0.003 60); --muted: oklch(0.66 0.007 60); --faint: oklch(0.52 0.006 60);
      --accent: oklch(0.685 0.2 36); --accent-ink: oklch(0.16 0.01 40); --accent-weak: oklch(0.685 0.2 36 / 0.17);
      --critical: oklch(0.64 0.2 28); --medium: oklch(0.76 0.13 72); --success: oklch(0.70 0.13 152); --success-weak: oklch(0.70 0.13 152 / 0.16);
    }
  }
  *{ box-sizing:border-box; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Geist", ui-sans-serif, system-ui, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:"Geist Mono", ui-monospace, Menlo, monospace; font-feature-settings:"tnum" 1; }
  h1,h2,h3{ color:var(--ink-strong); letter-spacing:-0.012em; margin:0; font-weight:600; }
  button{ font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .tnum{ font-variant-numeric:tabular-nums; }
  ::-webkit-scrollbar{ width:11px; height:11px; } ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:99px; border:3px solid var(--bg); }
  [data-btn],[data-row],[data-sw]{ transition:background .15s ease, border-color .15s ease, color .15s ease; }
  .fade-in{ animation:fade .2s cubic-bezier(0.22,1,0.36,1); } @keyframes fade{ from{opacity:0; transform:translateY(2px);} to{opacity:1;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const I = {
  logo:(p)=><svg viewBox="0 0 24 24" width="20" height="20" fill="none" {...p}><path d="M12 2l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V5l7-3z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  alerts:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M12 3a5 5 0 00-5 5c0 4-1.5 5.5-2 6h14c-.5-.5-2-2-2-6a5 5 0 00-5-5z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" strokeWidth="1.5"/></svg>,
  contracts:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" strokeWidth="1.5"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
  plan:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" strokeWidth="1.5"/></svg>,
  audits:(p)=><svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M6 3h9l4 4v14H6z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M14 3v4h4" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M9 14l2 2 4-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  search:(p)=><svg viewBox="0 0 24 24" width="15" height="15" fill="none" {...p}><circle cx="11" cy="11" r="6" stroke="currentColor" strokeWidth="1.6"/><path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  check:(p)=><svg viewBox="0 0 24 24" width="13" height="13" fill="none" {...p}><path d="M5 12l4 4L19 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  spark:(p)=><svg viewBox="0 0 24 24" width="13" height="13" fill="none" {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>,
};
const TRIG_LABEL = { "governance.proposal_submitted":"gov · proposal", "governance.proxy_upgrade":"gov · upgrade", "transfer.outflow":"transfer · outflow", "counterparty.new":"counterparty · new" };

function Chip({children, tone="neutral"}){
  const m = { neutral:["var(--surface-2)","var(--border)","var(--muted)"], accent:["var(--accent-weak)","transparent","var(--accent)"],
    success:["var(--success-weak)","transparent","var(--success)"], ghost:["transparent","var(--border)","var(--muted)"],
    warn:["color-mix(in oklch,var(--accent) 14%,transparent)","transparent","var(--accent)"] }[tone];
  return <span className="mono" style={{fontSize:11, fontWeight:500, padding:"2px 7px", borderRadius:6, background:m[0], border:`1px solid ${m[1]}`, color:m[2], display:"inline-flex", alignItems:"center", gap:5, whiteSpace:"nowrap"}}>{children}</span>;
}
function Btn({children, kind="ghost", onClick, sm}){
  const base={padding:sm?"5px 10px":"7px 13px", borderRadius:8, fontSize:sm?12.5:13, fontWeight:500, border:"1px solid transparent", display:"inline-flex", alignItems:"center", gap:6};
  const k={ primary:{background:"var(--accent)", color:"var(--accent-ink)"}, ghost:{background:"transparent", color:"var(--ink)", borderColor:"var(--border-strong)"}, quiet:{background:"transparent", color:"var(--muted)"} }[kind];
  return <button data-btn onClick={onClick} style={{...base,...k}}
    onMouseEnter={e=>{if(kind==="ghost")e.currentTarget.style.background="var(--surface)"; if(kind==="quiet")e.currentTarget.style.color="var(--ink)";}}
    onMouseLeave={e=>{if(kind==="ghost")e.currentTarget.style.background="transparent"; if(kind==="quiet")e.currentTarget.style.color="var(--muted)";}}>{children}</button>;
}
function Toggle({on, onChange}){
  return <button data-sw onClick={onChange} role="switch" aria-checked={on} style={{width:38, height:22, borderRadius:99, padding:2,
    background:on?"var(--accent)":"var(--border-strong)", display:"inline-flex", justifyContent:on?"flex-end":"flex-start"}}>
    <span style={{width:18, height:18, borderRadius:99, background:"var(--bg)", transition:"all .15s ease", boxShadow:"0 1px 2px oklch(0 0 0/.2)"}}/>
  </button>;
}
function Section({title, note, action, children}){
  return <section style={{marginBottom:30}}>
    <div style={{display:"flex", alignItems:"baseline", gap:12, marginBottom:12}}>
      <h2 style={{fontSize:14.5, fontWeight:600}}>{title}</h2>
      {note && <span style={{fontSize:12.5, color:"var(--muted)"}}>{note}</span>}
      <span style={{flex:1}}/>{action}
    </div>
    <div style={{border:"1px solid var(--border)", borderRadius:11, overflow:"hidden", background:"var(--surface-2)"}}>{children}</div>
  </section>;
}
const Field=({label,children})=> <div><div style={{fontSize:10.5, textTransform:"uppercase", letterSpacing:"0.06em", color:"var(--faint)", marginBottom:3}}>{label}</div><div>{children}</div></div>;

/* ---------- data (Zest v0-vault-sbtc) ---------- */
const FNS = [
  {name:"socialize-debt", trig:"governance.proxy_upgrade", route:"Type 1", watching:"live", rule:"new code is audited before it executes"},
  {name:"system-borrow", trig:"transfer.outflow", asset:"sBTC", route:"Type 2", watching:"live", rule:"outflow ≥ live threshold, or a new counterparty"},
  {name:"redeem", trig:"transfer.outflow", asset:"sBTC", route:"Type 2", watching:"live", rule:"outflow ≥ live threshold"},
  {name:"register-market", trig:"counterparty.new", route:"Type 2", watching:"pending", rule:"a call from a counterparty outside the allowlist"},
];
const BASELINE = { asset:"sBTC", assetId:"SM3VDX…sbtc-token", n:300, p50:"91,386", p95:"612,400", p99:"770,115", max:"770,115", recipients:4, computed:"2d ago", suggested:"770,115" };
const SIG0 = { title:"socialize-debt forces unbounded LP loss", sev:"high", fn:"socialize-debt", pre:"scaled-amount is unbounded, with no cap or attested loss", poc:"green" };
const WAIVERS = [{ finding:"Authorized markets can draw liquidity via system-borrow", label:"by-design", note:"Bounded by the authorized-market allowlist. Accepted 4d ago, suppressed from paging." }];

/* ---------- shell ---------- */
function Nav(){
  const items=[["Alerts",I.alerts,false,4],["Contracts",I.contracts,true],["Monitoring Plan",I.plan,false],["Audits",I.audits,false]];
  return <aside style={{width:236, flexShrink:0, background:"var(--panel)", borderRight:"1px solid var(--border)", display:"flex", flexDirection:"column", padding:"16px 12px"}}>
    <div style={{display:"flex", alignItems:"center", gap:9, padding:"4px 8px 20px"}}><span style={{color:"var(--accent)"}}><I.logo/></span><span style={{fontWeight:600, fontSize:16, color:"var(--ink-strong)"}}>Sentinel</span></div>
    <nav style={{display:"grid", gap:2}}>{items.map(([l,ic,act,b])=>(
      <a key={l} data-btn href="#" onClick={e=>e.preventDefault()} style={{display:"flex", alignItems:"center", gap:10, padding:"8px 10px", borderRadius:8, fontSize:13.5, textDecoration:"none", fontWeight:act?500:450, color:act?"var(--ink-strong)":"var(--muted)", background:act?"var(--surface)":"transparent"}}
        onMouseEnter={e=>{if(!act)e.currentTarget.style.background="var(--surface)";}} onMouseLeave={e=>{if(!act)e.currentTarget.style.background="transparent";}}>
        <span style={{color:act?"var(--accent)":"var(--faint)", display:"inline-flex"}}>{ic()}</span>{l}<span style={{flex:1}}/>{b&&<span className="mono tnum" style={{fontSize:11, color:"var(--faint)"}}>{b}</span>}</a>))}
    </nav>
    <div style={{flex:1}}/>
    <div style={{fontSize:11.5, color:"var(--faint)", padding:"8px 10px", borderTop:"1px solid var(--border)"}}>Audit-informed monitoring<br/>Prevention + Detection</div>
  </aside>;
}
function TopBar(){
  return <header style={{height:56, flexShrink:0, borderBottom:"1px solid var(--border)", display:"flex", alignItems:"center", gap:16, padding:"0 24px"}}>
    <button data-btn style={{display:"flex", alignItems:"center", gap:9, width:320, maxWidth:"36vw", padding:"7px 11px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface)", color:"var(--muted)", fontSize:13}}>
      <I.search/><span style={{flex:1, textAlign:"left"}}>Search</span><span className="mono" style={{fontSize:11, border:"1px solid var(--border)", borderRadius:5, padding:"1px 5px", color:"var(--faint)"}}>⌘K</span></button>
    <span style={{flex:1}}/>
    <span style={{fontSize:12.5, color:"var(--muted)", display:"inline-flex", alignItems:"center", gap:7}}><span style={{width:7,height:7,borderRadius:99,background:"var(--success)"}}/>Watching <b style={{color:"var(--ink)",fontWeight:500}} className="tnum">3</b> contracts · <b style={{color:"var(--ink)",fontWeight:500}} className="tnum">9</b> functions</span>
  </header>;
}

/* ---------- threshold control (the moat interaction) ---------- */
function ThresholdRow(){
  const [live, setLive] = useState(null); // null = fail-safe (not promoted)
  return (
    <div style={{padding:"16px 18px", display:"grid", gap:14}}>
      <div style={{display:"flex", gap:26, flexWrap:"wrap"}}>
        <Field label="Asset"><span className="mono" style={{color:"var(--ink-strong)"}}>sBTC</span> <span className="mono" style={{color:"var(--faint)", fontSize:12}}>{BASELINE.assetId}</span></Field>
        <Field label="p50"><span className="mono tnum">{BASELINE.p50}</span></Field>
        <Field label="p95"><span className="mono tnum">{BASELINE.p95}</span></Field>
        <Field label="p99"><span className="mono tnum" style={{color:"var(--ink-strong)"}}>{BASELINE.p99}</span></Field>
        <Field label="max"><span className="mono tnum">{BASELINE.max}</span></Field>
        <Field label="known recipients"><span className="mono tnum">{BASELINE.recipients}</span></Field>
      </div>
      <div style={{borderTop:"1px solid var(--border)", paddingTop:14, display:"flex", alignItems:"center", gap:14, flexWrap:"wrap"}}>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <span style={{color:"var(--accent)"}}><I.spark/></span>
          <span style={{fontSize:13}}>Audit suggests <span className="mono tnum" style={{color:"var(--ink-strong)"}}>{BASELINE.suggested} sats</span> <span style={{color:"var(--muted)"}}>(p99 of {BASELINE.n} real outflows)</span></span>
        </div>
        <span style={{flex:1}}/>
        {live
          ? <span style={{display:"inline-flex", alignItems:"center", gap:10}}>
              <span style={{fontSize:13}}>Live gate <Chip tone="success"><I.check/> {live} sats</Chip></span>
              <Btn kind="quiet" sm onClick={()=>setLive(null)}>Revert to fail-safe</Btn>
            </span>
          : <span style={{display:"inline-flex", alignItems:"center", gap:12}}>
              <span style={{fontSize:12.5, color:"var(--medium)"}}>Live gate: not set · every outflow surfaces (fail-safe)</span>
              <Btn kind="primary" sm onClick={()=>setLive(BASELINE.suggested)}>Promote to live gate</Btn>
            </span>}
      </div>
    </div>
  );
}

function App(){
  const [sigOn, setSigOn] = useState(true);
  const tabs=["Monitoring Plan","Alerts","Audits"];
  const [tab] = useState("Monitoring Plan");
  return (
    <div style={{display:"flex", height:"100vh", overflow:"hidden"}}>
      <Nav/>
      <div style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <TopBar/>
        <main style={{flex:1, overflow:"auto"}}>
          <div style={{maxWidth:920, margin:"0 auto", padding:"26px 0 70px"}}>
            {/* header */}
            <div style={{padding:"0 24px"}}>
              <div style={{fontSize:12.5, color:"var(--muted)", marginBottom:10}}>Contracts <span style={{color:"var(--faint)"}}>/</span> <span style={{color:"var(--ink)"}}>v0-vault-sbtc</span></div>
              <div style={{display:"flex", alignItems:"flex-start", gap:14, flexWrap:"wrap"}}>
                <div>
                  <h1 style={{fontSize:22, display:"flex", alignItems:"center", gap:10}}>v0-vault-sbtc
                    <Chip tone="neutral">vault</Chip><Chip tone="success"><span style={{width:6,height:6,borderRadius:99,background:"var(--success)"}}/>monitoring live</Chip></h1>
                  <div className="mono" style={{fontSize:12.5, color:"var(--muted)", marginTop:7}}>SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-sbtc</div>
                </div>
                <span style={{flex:1}}/>
                <div style={{display:"flex", gap:8}}><Btn kind="ghost">Pause monitoring</Btn><Btn kind="ghost">Re-run audit</Btn></div>
              </div>
              <div style={{display:"flex", gap:22, marginTop:16, fontSize:12.5, color:"var(--muted)"}}>
                <span>Last audit <b style={{color:"var(--ink)", fontWeight:500}}>4d ago</b> · $2.21</span>
                <span><b style={{color:"var(--ink)", fontWeight:500}} className="tnum">4</b> functions watched</span>
                <span><b style={{color:"var(--ink)", fontWeight:500}} className="tnum">1</b> detection signature</span>
                <span>client <b style={{color:"var(--ink)", fontWeight:500}}>zest-protocol</b></span>
              </div>
              {/* tabs */}
              <div style={{display:"flex", gap:4, marginTop:20, borderBottom:"1px solid var(--border)"}}>
                {tabs.map(t=>(<a key={t} href="#" onClick={e=>e.preventDefault()} style={{padding:"9px 12px", fontSize:13.5, fontWeight: t===tab?500:450, color:t===tab?"var(--ink-strong)":"var(--muted)", borderBottom:`2px solid ${t===tab?"var(--accent)":"transparent"}`, marginBottom:-1}}>{t}{t==="Alerts"?<span className="mono" style={{fontSize:11, color:"var(--faint)", marginLeft:6}}>3</span>:null}</a>))}
              </div>
            </div>

            {/* plan */}
            <div style={{padding:"22px 24px 0"}}>
              <div style={{display:"flex", gap:10, alignItems:"flex-start", padding:"12px 14px", borderRadius:10, background:"var(--accent-weak)", marginBottom:26}}>
                <span style={{color:"var(--accent)", marginTop:1}}><I.spark/></span>
                <p style={{margin:0, fontSize:13, color:"var(--ink)", maxWidth:"78ch"}}>
                  Sentinel derived this scope from your last audit. Review and tune it. You promote the live gates and toggle the signatures. <b style={{fontWeight:500}}>Sentinel never changes a live gate on its own.</b>
                </p>
                <span style={{flex:1}}/><Btn kind="ghost" sm>Sync from latest audit</Btn>
              </div>

              <Section title="Watched functions" note="the privileged functions from the audit, and how each is routed">
                <div>
                  <div style={{display:"grid", gridTemplateColumns:"1.3fr 1.2fr 0.8fr 1.6fr", gap:12, padding:"9px 16px", fontSize:11, textTransform:"uppercase", letterSpacing:"0.05em", color:"var(--faint)", borderBottom:"1px solid var(--border)"}}>
                    <span>Function</span><span>Trigger</span><span>Status</span><span>Rule</span></div>
                  {FNS.map((f,i)=>(
                    <div key={f.name} data-row style={{display:"grid", gridTemplateColumns:"1.3fr 1.2fr 0.8fr 1.6fr", gap:12, padding:"12px 16px", alignItems:"center", borderTop:i?"1px solid var(--border)":"none", background:"var(--bg)"}}>
                      <span className="mono" style={{color:"var(--ink-strong)", fontSize:13}}>{f.name}</span>
                      <span style={{display:"inline-flex", gap:6, alignItems:"center"}}><Chip tone={f.route==="Type 1"?"accent":"ghost"}>{TRIG_LABEL[f.trig]}</Chip>{f.asset&&<span className="mono" style={{fontSize:11, color:"var(--faint)"}}>{f.asset}</span>}</span>
                      <span>{f.watching==="live"?<Chip tone="success"><I.check/>live</Chip>:<Chip tone="warn">pending</Chip>}</span>
                      <span style={{fontSize:12.5, color:"var(--muted)"}}>{f.rule}</span>
                    </div>))}
                </div>
              </Section>

              <Section title="Outflow baseline & threshold" note="learned from real on-chain history via the secondlayer Index"
                action={<Btn kind="quiet" sm>Recompute · computed {BASELINE.computed}</Btn>}>
                <ThresholdRow/>
              </Section>

              <Section title="Detection signatures" note="confirmed findings the monitor watches for being exploited">
                <div style={{background:"var(--bg)", padding:"14px 16px", display:"flex", gap:14, alignItems:"flex-start"}}>
                  <div style={{paddingTop:1}}><Toggle on={sigOn} onChange={()=>setSigOn(s=>!s)}/></div>
                  <div style={{flex:1, opacity:sigOn?1:0.55}}>
                    <div style={{display:"flex", gap:9, alignItems:"baseline", flexWrap:"wrap"}}>
                      <span style={{fontWeight:500, color:"var(--ink-strong)"}}>{SIG0.title}</span>
                      <Chip tone="accent">HIGH</Chip><Chip tone="neutral">● bug</Chip><Chip tone="success"><I.check/>PoC green</Chip>
                      <span className="mono" style={{fontSize:12, color:"var(--muted)"}}>fn {SIG0.fn}</span>
                    </div>
                    <p style={{margin:"9px 0 0", fontSize:12.5, color:"var(--muted)", maxWidth:"76ch"}}>
                      A confirmed finding from your audit (green PoC). Type-2 flags a runtime call as a possible exploitation, then a human verifies the precondition: <span style={{color:"var(--ink)"}}>{SIG0.pre}</span>.
                    </p>
                  </div>
                </div>
              </Section>

              <Section title="Accepted waivers" note="centralization / trust assumptions surfaced once, then suppressed">
                {WAIVERS.map((w,i)=>(
                  <div key={i} data-row style={{background:"var(--bg)", padding:"13px 16px", display:"flex", gap:12, alignItems:"center"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex", gap:9, alignItems:"baseline"}}><span style={{color:"var(--ink)"}}>{w.finding}</span><Chip tone="ghost">{w.label}</Chip></div>
                      <p style={{margin:"5px 0 0", fontSize:12.5, color:"var(--muted)"}}>{w.note}</p>
                    </div>
                    <Btn kind="quiet" sm>Un-waive</Btn>
                  </div>))}
              </Section>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
